<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>A TUM Ti · Panel</title>
<meta name="theme-color" content="#0B0F19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F19;
    --bg-soft:#111729;
    --surface:#171E32;
    --surface-raised:#212B46;
    --line: rgba(255,255,255,.08);
    --text:#F4F6FB;
    --text-muted:#8D96AC;
    --laser:#FF5A36;
    --laser-soft: rgba(255,90,54,.32);
    --amber:#FFB238;
    --amber-soft: rgba(255,178,56,.16);
    --ok:#33D17A;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    overflow:hidden; position:fixed; inset:0; width:100%;
  }
  button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
  svg{ display:block; }

  /* ---------- HOME / PANEL ---------- */
  #home{
    position:absolute; inset:0; height:100dvh; overflow-y:auto;
    display:flex; flex-direction:column; align-items:center;
    padding: max(28px, var(--safe-t)) 24px max(28px, var(--safe-b));
    background:
      radial-gradient(ellipse 70% 40% at 50% 28%, var(--bg-soft), transparent 70%),
      var(--bg);
    text-align:center;
  }
  .home-brand{ display:flex; align-items:center; gap:9px; margin-bottom:auto; padding-bottom:8px; }
  .home-brand .dot{ width:8px; height:8px; border-radius:50%; background:var(--laser); box-shadow:0 0 10px 2px var(--laser-soft); }
  .home-brand strong{ font-family:var(--font-display); font-weight:700; font-size:15px; }

  .home-eyebrow{
    font-family:var(--font-mono); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--amber); margin: 18px 0 10px;
  }
  .home-title{
    font-family:var(--font-display); font-weight:700; font-size:clamp(22px,7vw,28px);
    line-height:1.15; margin:0 0 40px; letter-spacing:-0.01em; max-width:300px;
  }

  /* ---- Grid tipo teclado telefónico: botones circulares del mismo
     tamaño, uno por función, solo ícono + una palabra chica debajo
     (igual que un teclado numérico real: número grande + letras chicas
     abajo). Mismo lenguaje visual que .cart-gate-btn del Creador. ---- */
  .dial-grid{
    display:flex; justify-content:center; gap:22px; flex-wrap:wrap;
    max-width:360px;
  }
  .dial-item{ display:flex; flex-direction:column; align-items:center; gap:11px; width:112px; }
  .dial-wrap{ position:relative; }

  .dial-btn{
    position:relative;
    width:112px; height:112px;
    border-radius:34px;
    background: linear-gradient(160deg, var(--surface-raised), var(--surface));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 18px 40px -18px rgba(0,0,0,.75);
    transition: transform .15s cubic-bezier(.3,1.6,.4,1);
  }
  .dial-btn:active{ transform:scale(.92); }
  .dial-btn svg{ width:42px; height:42px; }
  .dial-btn.c-crear svg{ color:var(--laser); }
  .dial-btn.c-registrar svg{ color:var(--amber); }

  .dial-btn.c-completo{
    background: linear-gradient(160deg, var(--amber), #E08A00);
    border-color:transparent;
    color:#1a1200;
    box-shadow: 0 20px 46px -16px rgba(255,178,56,.55);
  }
  .dial-btn.c-completo::before{
    content:''; position:absolute; inset:-10px; border-radius:42px;
    border:1.5px solid var(--amber-soft);
    animation: ringPulse 2.6s ease-out infinite;
  }

  .dial-caption{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--text-muted); font-weight:600;
  }

  .guide-btn{
    position:absolute; top:-5px; right:-5px;
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface); border:1px solid var(--line);
    color:var(--text-muted); font-family:var(--font-mono); font-weight:700; font-size:12px;
    box-shadow: 0 6px 16px -6px rgba(0,0,0,.8);
    z-index:2;
  }
  .guide-btn:active{ transform:scale(.88); }

  .home-footnote{
    margin-top:auto; padding-top:34px; display:flex; align-items:center; gap:7px;
    color:var(--text-muted); font-size:12px; font-family:var(--font-mono);
  }
  .home-footnote svg{ width:14px; height:14px; flex-shrink:0; color:var(--ok); }

  @keyframes ringPulse{
    0%{ transform:scale(1); opacity:.9; }
    80%{ opacity:0; }
    100%{ transform:scale(1.045); opacity:0; }
  }

  /* ---------- GUIDE SHEET ---------- */
  .sheet-backdrop{
    position:absolute; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none;
    transition:opacity .2s ease; z-index:40;
  }
  .sheet-backdrop.show{ opacity:1; pointer-events:auto; }
  .guide-sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:41;
    background: var(--bg-soft); border-top:1px solid var(--line);
    border-radius: 26px 26px 0 0;
    padding: 20px 22px max(22px, var(--safe-b));
    transform: translateY(100%);
    transition: transform .25s cubic-bezier(.3,1,.4,1);
    max-height:72dvh; overflow-y:auto;
  }
  .guide-sheet.show{ transform:translateY(0); }
  .guide-handle{ width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 16px; }
  .guide-sheet h3{ font-family:var(--font-display); font-size:17px; margin:0 0 4px; }
  .guide-sheet p.lead{ color:var(--text-muted); font-size:13px; margin:0 0 18px; }
  .guide-steps{ list-style:none; margin:0 0 20px; padding:0; display:flex; flex-direction:column; gap:14px; }
  .guide-steps li{ display:flex; gap:12px; align-items:flex-start; }
  .guide-num{
    flex-shrink:0; width:26px; height:26px; border-radius:9px; background:var(--surface-raised);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--amber);
  }
  .guide-steps b{ display:block; font-size:13.5px; margin-bottom:2px; }
  .guide-steps span{ color:var(--text-muted); font-size:12.5px; line-height:1.4; }
  .guide-close-btn{
    width:100%; height:50px; border-radius:16px; background:var(--surface-raised);
    border:1px solid var(--line); color:var(--text); font-weight:600; font-size:14px;
  }
  .guide-close-btn:active{ transform:scale(.98); }

  /* ---------- APP VIEW (iframe host) ---------- */
  #appView{
    position:absolute; inset:0; height:100dvh; display:none;
    flex-direction:column; background:var(--bg); z-index:20;
  }
  #appView.active{ display:flex; }
  .app-topbar{
    flex-shrink:0; display:flex; align-items:center;
    padding: max(12px, var(--safe-t)) 14px 12px;
    background:var(--bg-soft); border-bottom:1px solid var(--line);
  }
  .app-home-btn{
    width:44px; height:44px; border-radius:15px; flex-shrink:0;
    background: linear-gradient(160deg, var(--surface-raised), var(--surface));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--amber);
    box-shadow: 0 10px 22px -12px rgba(0,0,0,.7);
    transition: transform .15s cubic-bezier(.3,1.6,.4,1);
  }
  .app-home-btn svg{ width:20px; height:20px; }
  .app-home-btn:active{ transform:scale(.9); }
  #appFrame{ flex:1; width:100%; border:none; background:var(--bg); }
</style>
</head>
<body>

  <div id="home">
    <div class="home-brand">
      <span class="dot"></span>
      <strong>A TUM Ti</strong>
    </div>

    <p class="home-eyebrow">Panel administrativo</p>
    <h1 class="home-title">¿Qué vas a hacer ahora?</h1>

    <div class="dial-grid">

      <div class="dial-item">
        <div class="dial-wrap">
          <button class="dial-btn c-crear" data-mode="crear" aria-label="Crear pedido">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.6"/>
              <rect x="14" y="3" width="7" height="7" rx="1.6"/>
              <rect x="3" y="14" width="7" height="7" rx="1.6"/>
              <rect x="14.5" y="14.5" width="2.6" height="2.6" rx="0.6" fill="currentColor" stroke="none"/>
              <rect x="19" y="14.5" width="2" height="2" fill="currentColor" stroke="none"/>
              <rect x="14.5" y="19" width="2" height="2" fill="currentColor" stroke="none"/>
              <rect x="18.5" y="18.5" width="3" height="3" rx="0.6" fill="currentColor" stroke="none"/>
            </svg>
          </button>
          <button class="guide-btn" data-guide="crear" aria-label="Cómo funciona Crear pedido">?</button>
        </div>
        <span class="dial-caption">Crear</span>
      </div>

      <div class="dial-item">
        <div class="dial-wrap">
          <button class="dial-btn c-registrar" data-mode="registrar" aria-label="Registrar venta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 8.5V5.5a1 1 0 0 1 1-1h3"/>
              <path d="M20 8.5V5.5a1 1 0 0 0-1-1h-3"/>
              <path d="M4 15.5v3a1 1 0 0 0 1 1h3"/>
              <path d="M20 15.5v3a1 1 0 0 1-1 1h-3"/>
              <path d="M7.5 12.3l2.8 2.8 5.7-6.2"/>
            </svg>
          </button>
          <button class="guide-btn" data-guide="registrar" aria-label="Cómo funciona Registrar venta">?</button>
        </div>
        <span class="dial-caption">Registrar</span>
      </div>

      <div class="dial-item">
        <div class="dial-wrap">
          <button class="dial-btn c-completo" data-mode="completo" aria-label="Proceso completo: crear y registrar">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <path d="M13.2 2.2 4.4 13.6a.7.7 0 0 0 .55 1.13h5.1l-1.05 7.1a.7.7 0 0 0 1.24.54l8.8-11.4a.7.7 0 0 0-.55-1.13h-5.1l1.05-7.1a.7.7 0 0 0-1.29-.54z"/>
            </svg>
          </button>
          <button class="guide-btn" data-guide="completo" aria-label="Cómo funciona Proceso completo">?</button>
        </div>
        <span class="dial-caption">Todo en uno</span>
      </div>

    </div>

    <div class="home-footnote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      <span>Todo se guarda en este dispositivo</span>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="guide-sheet" id="guideSheet">
    <div class="guide-handle"></div>
    <h3 id="guideTitle"></h3>
    <p class="lead" id="guideLead"></p>
    <ul class="guide-steps" id="guideSteps"></ul>
    <button class="guide-close-btn" id="guideCloseBtn">Entendido</button>
  </div>

  <div id="appView">
    <div class="app-topbar">
      <button class="app-home-btn" id="appBackBtn" aria-label="Volver al menú principal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V19a1 1 0 0 0 1 1H10v-5.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V20h3.5a1 1 0 0 0 1-1V9.8"/></svg>
      </button>
    </div>
    <iframe id="appFrame" allow="camera; microphone" title="A TUM Ti"></iframe>
  </div>

  function b64ToUtf8(b64){
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  var creadorHTML = null, registradorHTML = null, todoEnUnoHTML = null;
  function getCreadorHTML(){ if (!creadorHTML) creadorHTML = b64ToUtf8(CREADOR_B64); return creadorHTML; }
  function getRegistradorHTML(){ if (!registradorHTML) registradorHTML = b64ToUtf8(REGISTRADOR_B64); return registradorHTML; }
  function getTodoEnUnoHTML(){ if (!todoEnUnoHTML) todoEnUnoHTML = b64ToUtf8(TODOENUNO_B64); return todoEnUnoHTML; }

  // Inyecta window.ATUMTI_MODE antes de que corra cualquier script de la
  // app hija, justo después de <head>, para que sepa en qué modo está.
  function withMode(html, mode){
    var tag = '<head><script>window.ATUMTI_MODE=' + JSON.stringify(mode) + ';<\/script>';
    return html.replace('<head>', tag);
  }

  // ---------- Elementos ----------
  var home = document.getElementById('home');
  var appView = document.getElementById('appView');
  var appFrame = document.getElementById('appFrame');
  var appBackBtn = document.getElementById('appBackBtn');

  var sheetBackdrop = document.getElementById('sheetBackdrop');
  var guideSheet = document.getElementById('guideSheet');
  var guideTitle = document.getElementById('guideTitle');
  var guideLead = document.getElementById('guideLead');
  var guideSteps = document.getElementById('guideSteps');
  var guideCloseBtn = document.getElementById('guideCloseBtn');

  // ---------- Guías por botón (idea de guía integrada en cada paso) ----------
  var GUIDES = {
    crear: {
      title: 'Crear pedido',
      lead: 'Para armar un pedido nuevo y generar su QR.',
      steps: [
        ['Sumá productos', 'Escaneá el código de barras, escribilo a mano, o buscá por nombre del producto.'],
        ['Revisá el carrito', 'Ajustá cantidades y mirá el total antes de continuar.'],
        ['Generá el QR', 'Cargá los datos del cliente (opcional) y el sistema arma el comprobante con su código QR.']
      ]
    },
    registrar: {
      title: 'Registrar venta',
      lead: 'Para cobrar un pedido que ya tiene su QR generado.',
      steps: [
        ['Leé el QR', 'Con la cámara o subiendo una foto del código.'],
        ['Revisá y ajustá', 'Podés añadir productos que faltaron, editar cantidades o quitar alguno.'],
        ['Cobrá', 'Elegí efectivo o QR, confirmá el pago y quedará guardada la venta en el dispositivo.']
      ]
    },
    completo: {
      title: 'Proceso completo',
      lead: 'Arma y cobra el pedido en una sola app, sin cortar el proceso.',
      steps: [
        ['Armá el pedido', 'Escaneo, código manual o búsqueda por nombre, todo dentro de la misma pantalla.'],
        ['Revisá el carrito', 'Ajustá cantidades y mirá el total antes de continuar.'],
        ['Cobrá al toque', 'Elegí efectivo o QR, confirmá el pago y quedará guardada la venta, sin cambiar de app.']
      ]
    }
  };

  function openGuide(mode){
    var g = GUIDES[mode];
    if (!g) return;
    guideTitle.textContent = g.title;
    guideLead.textContent = g.lead;
    guideSteps.innerHTML = g.steps.map(function(s, i){
      return '<li><span class="guide-num">' + (i+1) + '</span><div><b>' + s[0] + '</b><span>' + s[1] + '</span></div></li>';
    }).join('');
    sheetBackdrop.classList.add('show');
    guideSheet.classList.add('show');
  }
  function closeGuide(){
    sheetBackdrop.classList.remove('show');
    guideSheet.classList.remove('show');
  }
  sheetBackdrop.addEventListener('click', closeGuide);
  guideCloseBtn.addEventListener('click', closeGuide);

  document.querySelectorAll('.guide-btn').forEach(function(btn){
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      openGuide(btn.dataset.guide);
    });
  });

  // ---------- Flujo unificado: estado ----------
  var currentFlow = null;      // 'crear' | 'registrar' | 'completo'
  var completoStage = null;    // 'crear' | 'registrar' (solo cuando currentFlow === 'completo')
  var pendingPayload = null;

  function loadFrame(html, mode){
    appFrame.srcdoc = withMode(html, mode);
  }

  function openApp(mode){
    currentFlow = mode;
    home.style.display = 'none';
    appView.classList.add('active');

    if (mode === 'crear'){
      loadFrame(getCreadorHTML(), 'standalone');
    } else if (mode === 'registrar'){
      loadFrame(getRegistradorHTML(), 'standalone');
    } else if (mode === 'completo'){
      completoStage = null;
      pendingPayload = null;
      loadFrame(getTodoEnUnoHTML(), 'standalone');
    }
  }

  function closeApp(){
    var confirmMsg = currentFlow ? '¿Volver al panel? Se va a perder lo que no hayas guardado en este paso.' : null;
    if (confirmMsg && !confirm(confirmMsg)) return;

    appFrame.srcdoc = 'about:blank';
    appView.classList.remove('active');
    home.style.display = '';
    currentFlow = null; completoStage = null; pendingPayload = null;
  }

  document.querySelectorAll('.dial-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      openApp(btn.dataset.mode);
    });
  });
  appBackBtn.addEventListener('click', closeApp);

  // ---------- Puente de mensajes con las apps hijas ----------
  // (Ya no se usa para "Proceso completo": esa app ahora es un único
  // archivo autocontenido. Se deja el listener por si Crear/Registrar
  // llegan a necesitarlo más adelante.)
  window.addEventListener('message', function(ev){
    var msg = ev.data;
    if (!msg || !msg.type) return;
    if (ev.source !== appFrame.contentWindow) return;
  });

})();
</script>
