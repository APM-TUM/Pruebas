<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>CreadorQR · Mi Compra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F19;
    --bg-soft:#111729;
    --surface:#171E32;
    --surface-raised:#212B46;
    --line: rgba(255,255,255,.08);
    --text:#F4F6FB;
    --text-muted:#8D96AC;
    --laser:#FF5A36;
    --laser-soft: rgba(255,90,54,.32);
    --amber:#FFB238;
    --amber-soft: rgba(255,178,56,.16);
    --ok:#33D17A;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    overflow:hidden;
    position:fixed;
    inset:0;
    width:100%;
    -webkit-user-select:none;
    user-select:none;
  }
  button{ font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
  input{ font-family:inherit; }
  svg{ display:block; }

  .screen{
    position:absolute; inset:0;
    height:100dvh;
    display:flex; flex-direction:column;
  }
  .hidden{ display:none !important; }

  /* ---------- GATE ---------- */
  .gate{
    align-items:center; justify-content:center;
    text-align:center;
    padding: max(24px, var(--safe-t)) 28px max(24px, var(--safe-b));
    background:
      radial-gradient(ellipse 70% 45% at 50% 32%, var(--bg-soft), transparent 70%),
      var(--bg);
    transition: opacity .35s ease, transform .35s ease;
  }
  .gate.leaving{ opacity:0; transform: scale(.97); }

  .gate-eyebrow{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 14px;
  }
  .gate h1{
    font-family: var(--font-display);
    font-weight:700;
    font-size: clamp(28px, 8vw, 38px);
    line-height:1.1;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  .gate p{
    color: var(--text-muted);
    font-size: 15px;
    margin: 0 0 44px;
    max-width: 280px;
  }

  .cart-gate-btn{
    position:relative;
    width: 132px; height: 132px;
    border-radius: 36px;
    background: linear-gradient(160deg, var(--surface-raised), var(--surface));
    border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,.7);
    transition: transform .15s cubic-bezier(.3,1.6,.4,1);
  }
  .cart-gate-btn::before{
    content:'';
    position:absolute; inset:-14px;
    border-radius: 44px;
    border: 1.5px solid var(--amber-soft);
    animation: ringPulse 2.6s ease-out infinite;
  }
  .cart-gate-btn:active{ transform: scale(.92); }
  .cart-gate-btn svg{ width: 58px; height:58px; }
  .cart-gate-btn .count-pill{
    position:absolute; top:-8px; right:-8px;
    min-width:28px; height:28px; padding:0 8px;
    border-radius:14px;
    background: var(--laser);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:700; font-size:13px;
    box-shadow: 0 6px 16px -4px rgba(255,90,54,.6);
    opacity:0; transform: scale(.5);
    transition: opacity .2s ease, transform .2s cubic-bezier(.3,1.6,.4,1);
  }
  .cart-gate-btn .count-pill.show{ opacity:1; transform:scale(1); }

  .gate-tap-hint{
    margin-top: 22px;
    font-size: 13px;
    color: var(--text-muted);
    display:flex; align-items:center; gap:6px;
  }

  @keyframes ringPulse{
    0%{ transform:scale(.9); opacity:.9; }
    80%{ opacity:0; }
    100%{ transform:scale(1.18); opacity:0; }
  }

  /* ---------- SYNC OVERLAY ---------- */
  .sync-overlay{
    align-items:center; justify-content:center;
    background: var(--bg);
    z-index: 30;
    opacity:0;
    transition: opacity .25s ease;
  }
  .sync-overlay.active{ opacity:1; }
  .sync-stage{
    position:relative;
    width: 180px; height:120px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    background: var(--surface);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .sync-stage svg{ width:52px; height:52px; opacity:.5; }
  .sync-beam{
    position:absolute; left:0; right:0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--laser), transparent);
    box-shadow: 0 0 18px 3px var(--laser-soft);
    top:0;
    animation: beamSweep 1.1s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes beamSweep{
    0%{ top:6%; }
    50%{ top:92%; }
    100%{ top:6%; }
  }
  .sync-text{
    margin-top:22px;
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: .06em;
    color: var(--text-muted);
  }
  .sync-text .dots::after{
    content:'';
    animation: dots 1.2s steps(4,end) infinite;
  }
  @keyframes dots{
    0%{ content:''; } 25%{ content:'.'; } 50%{ content:'..'; } 75%{ content:'...'; } 100%{ content:''; }
  }

  /* ---------- SCANNER SCREEN ---------- */
  .scanner{
    background: var(--bg);
    opacity:0; transform: translateY(10px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .scanner.active{ opacity:1; transform:none; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: max(16px, var(--safe-t)) 20px 12px;
    flex-shrink:0;
  }
  .brand{
    font-family: var(--font-display); font-weight:700; font-size:17px;
    display:flex; align-items:center; gap:8px;
  }
  .brand-dot{ width:8px; height:8px; border-radius:50%; background:var(--laser); box-shadow: 0 0 10px 2px var(--laser-soft); }

  .cart-badge-btn{
    position:relative;
    width:52px; height:52px;
    border-radius:16px;
    background: var(--surface);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease;
  }
  .cart-badge-btn:active{ transform: scale(.9); }
  .cart-badge-btn svg{ width:26px; height:26px; }
  .cart-badge-btn .badge{
    position:absolute; top:-6px; right:-6px;
    min-width:22px; height:22px; padding:0 5px;
    border-radius:11px; background:var(--amber); color:#1a1200;
    font-family: var(--font-display); font-weight:700; font-size:12px;
    display:flex; align-items:center; justify-content:center;
    transform: scale(0); transition: transform .18s cubic-bezier(.3,1.6,.4,1);
  }
  .cart-badge-btn .badge.show{ transform:scale(1); }
  .cart-badge-btn.bump{ animation: bump .3s ease; }
  @keyframes bump{ 0%,100%{transform:scale(1);} 40%{ transform:scale(1.18); } }

  .mode-toggle{
    flex-shrink:0;
    margin: 6px 20px 18px;
    display:flex;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: 18px;
    padding: 5px;
    gap:5px;
  }
  .mode-btn{
    flex:1;
    height:52px;
    border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-muted);
    transition: background .18s ease, color .18s ease;
  }
  .mode-btn svg{ width:26px; height:26px; }
  .mode-btn.selected{ background: var(--surface-raised); color: var(--amber); }

  .stage-wrap{
    flex:1;
    min-height:0;
    padding: 0 20px;
    display:flex;
    flex-direction:column;
  }

  /* camera viewfinder */
  .viewfinder{
    position:relative;
    flex:1;
    min-height: 220px;
    border-radius: var(--radius-lg);
    background: var(--surface);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    border: 1px solid var(--line);
  }
  #reader{ position:absolute; inset:0; }
  #reader video{ width:100% !important; height:100% !important; object-fit:cover; }

  .reticle{
    position:absolute; inset: 14%;
    pointer-events:none;
    z-index:2;
  }
  .reticle .corner{
    position:absolute; width:30px; height:30px;
    border-color: var(--amber);
    opacity:.85;
  }
  .reticle .tl{ top:0; left:0; border-top:3px solid; border-left:3px solid; border-top-left-radius:10px; }
  .reticle .tr{ top:0; right:0; border-top:3px solid; border-right:3px solid; border-top-right-radius:10px; }
  .reticle .bl{ bottom:0; left:0; border-bottom:3px solid; border-left:3px solid; border-bottom-left-radius:10px; }
  .reticle .br{ bottom:0; right:0; border-bottom:3px solid; border-right:3px solid; border-bottom-right-radius:10px; }

  .cam-laser{
    position:absolute; left:14%; right:14%; height:2.5px;
    background: linear-gradient(90deg, transparent, var(--laser), transparent);
    box-shadow: 0 0 16px 3px var(--laser-soft);
    top:14%;
    z-index:3;
    animation: camSweep 2.1s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes camSweep{
    0%{ top:14%; } 50%{ top:86%; } 100%{ top:14%; }
  }

  .flash-ok{
    position:absolute; inset:0;
    background: radial-gradient(circle, rgba(51,209,122,.35), transparent 65%);
    opacity:0; z-index:4; pointer-events:none;
  }
  .flash-ok.fail{
    background: radial-gradient(circle, rgba(255,90,54,.38), transparent 65%);
  }
  .flash-ok.play{ animation: flashOk .55s ease-out; }
  @keyframes flashOk{ 0%{ opacity:1; } 100%{ opacity:0; } }

  /* ---------- SCAN TOAST (alerta verde / roja) ---------- */
  .catalog-status{
    flex-shrink:0;
    margin: -10px 20px 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing:.02em;
    color: var(--text-muted);
    text-align:center;
    min-height: 14px;
  }
  .scan-toast{
    position:fixed;
    left:20px; right:20px;
    top: calc(max(16px, var(--safe-t)) + 66px);
    z-index:50;
    display:flex; align-items:center; gap:12px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    background: var(--surface-raised);
    border: 1px solid var(--line);
    box-shadow: 0 20px 50px -18px rgba(0,0,0,.75);
    transform: translateY(-140%);
    opacity:0;
    pointer-events:none;
    transition: transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s ease;
  }
  .scan-toast.show{ transform:none; opacity:1; }
  .scan-toast .icon{
    width:26px; height:26px; border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-weight:700; font-size:14px;
  }
  .scan-toast .msg{
    flex:1; min-width:0;
    font-size:14.5px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .scan-toast.ok{ border-color: rgba(51,209,122,.35); }
  .scan-toast.ok .icon{ background: var(--ok); color:#04240f; }
  .scan-toast.ok .msg{ color: var(--ok); }
  .scan-toast.error{ border-color: var(--laser-soft); }
  .scan-toast.error .icon{ background: var(--laser); color:#2a0700; }
  .scan-toast.error .msg{ color: var(--laser); }

  .cam-fallback{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; text-align:center; padding: 0 30px;
    color: var(--text-muted); font-size:13px;
    background: var(--surface);
    z-index:5;
  }
  .cam-fallback svg{ width:34px; height:34px; opacity:.6; }

  /* manual entry */
  .manual-panel{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
  }
  .manual-panel svg.big-hint{ width:64px; height:64px; color: var(--amber); opacity:.9; }
  .manual-input-row{
    width:100%;
    max-width:360px;
    display:flex; align-items:center;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 20px;
    padding: 6px 6px 6px 20px;
    transition: border-color .15s ease;
  }
  .manual-input-row:focus-within{ border-color: var(--amber); }
  .manual-input-row input{
    flex:1;
    background:none; border:none; outline:none;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 18px;
    letter-spacing: .04em;
    min-width:0;
    padding: 14px 6px;
  }
  .manual-input-row input::placeholder{ color: var(--text-muted); font-family: var(--font-body); letter-spacing:normal; font-size:15px; }
  .manual-send{
    width:48px; height:48px; border-radius:14px;
    background: var(--amber);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition: transform .12s ease, opacity .12s ease;
  }
  .manual-send svg{ width:22px; height:22px; color:#1a1200; }
  .manual-send:active{ transform: scale(.88); }
  .manual-send:disabled{ opacity:.35; }

  /* ---------- CART SHEET ---------- */
  .sheet-backdrop{
    position:fixed; inset:0;
    background: rgba(4,6,12,.6);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
    z-index:40;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }

  .cart-sheet{
    position:fixed; left:0; right:0; bottom:0;
    background: var(--bg-soft);
    border-top: 1px solid var(--line);
    border-radius: 26px 26px 0 0;
    z-index:41;
    max-height: 72dvh;
    display:flex; flex-direction:column;
    transform: translateY(102%);
    transition: transform .32s cubic-bezier(.2,.9,.3,1);
    padding-bottom: max(14px, var(--safe-b));
  }
  .cart-sheet.open{ transform: translateY(0); }

  .sheet-handle{
    width:40px; height:4px; border-radius:2px;
    background: var(--line);
    margin: 12px auto 6px;
  }
  .sheet-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 6px 22px 14px;
  }
  .sheet-header h2{
    font-family: var(--font-display); font-size:19px; margin:0;
    display:flex; align-items:center; gap:10px;
  }
  .sheet-header h2 .n{ color:var(--amber); }
  .trash-btn{
    width:46px; height:46px; border-radius:14px;
    background: var(--surface);
    border: 1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease, background .12s ease;
  }
  .trash-btn svg{ width:22px; height:22px; color: var(--laser); }
  .trash-btn:active{ transform: scale(.9); background: var(--surface-raised); }

  .cart-list{
    overflow-y:auto;
    padding: 4px 16px 10px;
    display:flex; flex-direction:column; gap:8px;
  }
  .cart-row{
    display:flex; align-items:center; gap:12px;
    background: var(--surface);
    border-radius: 16px;
    padding: 12px 14px;
    animation: rowIn .22s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes rowIn{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:none; } }
  .cart-row .dot{
    width:8px; height:8px; border-radius:50%; background: var(--ok); flex-shrink:0;
  }
  .cart-row .code{
    flex:1; min-width:0;
    font-family: var(--font-mono); font-size:14.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cart-row .qty{
    font-family: var(--font-display); font-weight:700; font-size:13px;
    color: var(--amber);
    background: var(--amber-soft);
    padding: 5px 10px; border-radius: 10px;
    flex-shrink:0;
  }
  .cart-row .remove-btn{
    width:34px; height:34px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-muted); flex-shrink:0;
  }
  .cart-row .remove-btn svg{ width:16px; height:16px; }
  .cart-row .remove-btn:active{ background: var(--surface-raised); }

  .cart-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding: 40px 20px 50px;
    color: var(--text-muted); text-align:center; font-size:14px;
  }
  .cart-empty svg{ width:40px; height:40px; opacity:.5; }

  @media (prefers-reduced-motion: reduce){
    .cart-gate-btn::before, .sync-beam, .cam-laser, .rowIn, .cart-badge-btn.bump{ animation: none !important; }
  }
</style>
</head>
<body>

  <!-- ================= GATE ================= -->
  <div id="gate" class="screen gate">
    <p class="gate-eyebrow">CreadorQR</p>
    <h1>¿Listo para<br>tu compra?</h1>
    <p>Toca el carrito para empezar a escanear tus productos.</p>

    <button id="cartGateBtn" class="cart-gate-btn" aria-label="Ingresar y comenzar mi compra">
      <span id="gateCountPill" class="count-pill">0</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1.4" fill="var(--amber)" stroke="none"/>
        <circle cx="18" cy="21" r="1.4" fill="var(--amber)" stroke="none"/>
        <path d="M2.5 3h2.4l2.1 11.4a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.6L21 7H6"/>
      </svg>
    </button>

    <div class="gate-tap-hint">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Toca para ingresar
    </div>
  </div>

  <!-- ================= SYNC ================= -->
  <div id="sync" class="screen sync-overlay hidden">
    <div>
      <div class="sync-stage">
        <div class="sync-beam"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1.4" fill="var(--text)" stroke="none"/>
          <circle cx="18" cy="21" r="1.4" fill="var(--text)" stroke="none"/>
          <path d="M2.5 3h2.4l2.1 11.4a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.6L21 7H6"/>
        </svg>
      </div>
      <p class="sync-text">Ingresando<span class="dots"></span></p>
    </div>
  </div>

  <!-- ================= SCANNER ================= -->
  <div id="scanner" class="screen scanner hidden">
    <div class="topbar">
      <div class="brand"><span class="brand-dot"></span>CreadorQR</div>
      <button id="cartBadgeBtn" class="cart-badge-btn" aria-label="Ver mi carrito">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1.4" fill="var(--text)" stroke="none"/>
          <circle cx="18" cy="21" r="1.4" fill="var(--text)" stroke="none"/>
          <path d="M2.5 3h2.4l2.1 11.4a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.6L21 7H6"/>
        </svg>
        <span id="cartBadgeCount" class="badge">0</span>
      </button>
    </div>

    <div class="mode-toggle">
      <button id="modeCameraBtn" class="mode-btn selected" aria-label="Escanear con cámara">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <button id="modeKeyboardBtn" class="mode-btn" aria-label="Digitar código">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="13" rx="2"/>
          <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M10 14h4"/>
        </svg>
      </button>
    </div>

    <p id="catalogStatus" class="catalog-status"></p>

    <div class="stage-wrap">
      <!-- Camera panel -->
      <div id="cameraPanel" class="viewfinder">
        <div id="reader"></div>
        <div class="reticle">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
        </div>
        <div class="cam-laser"></div>
        <div id="flashOk" class="flash-ok"></div>
        <div id="camFallback" class="cam-fallback hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22"/><path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h4"/><path d="M14.5 6l1.5 3H21a2 2 0 0 1 2 2v9.34"/><circle cx="12" cy="13" r="4"/></svg>
          <span>No pudimos activar la cámara.<br>Usa el teclado para digitar el código.</span>
        </div>
      </div>

      <!-- Manual panel -->
      <div id="manualPanel" class="manual-panel hidden">
        <svg class="big-hint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="8" width="18" height="8" rx="1"/>
          <path d="M6 8v8M9 8v8M12 8v8M16 8v8M19 8v8"/>
        </svg>
        <div class="manual-input-row">
          <input id="manualInput" type="text" inputmode="numeric" placeholder="Código de barras" autocomplete="off">
          <button id="manualSendBtn" class="manual-send" aria-label="Agregar código" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M13 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= ALERTA VERDE/ROJA ================= -->
  <div id="scanToast" class="scan-toast"></div>

  <!-- ================= CART SHEET ================= -->
  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <div id="cartSheet" class="cart-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2>Mi carrito <span id="sheetCount" class="n">(0)</span></h2>
      <button id="trashBtn" class="trash-btn" aria-label="Vaciar carrito">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
      </button>
    </div>
    <div id="cartList" class="cart-list"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- Catálogo de productos (sincronizado y guardado en el dispositivo) ----------
  // Pega aquí la URL de tu Apps Script (la misma fuente de datos que usa
  // tu otra app). Debe devolver { ok:true, productos:[ {Pro_Id, Pro_CodigoBarra, Pro_Descripcion, ...}, ... ] }
  var API_URL = 'https://script.google.com/macros/s/AKfycbzc3KC1UiY-b99aZzDAJ4Ut9gDvxCamc_EjrNoHIr6-N4ejscAaGYsAmyxcQGImWY9w/exec';
  var LS_PRODUCTOS = 'atumti_productos_cache';
  var productos = []; // catálogo en memoria: [{Pro_Id, Pro_CodigoBarra, Pro_Descripcion, ...}]

  // ---------- State ----------
  var cart = []; // { id, code, name, qty }
  var lastScanAt = {}; // code -> timestamp, cooldown to avoid duplicate reads
  var SCAN_COOLDOWN_MS = 1800;
  var html5QrCode = null;
  var cameraStarting = false;
  var audioCtxScan = null;

  // ---------- Elements ----------
  var gate = document.getElementById('gate');
  var cartGateBtn = document.getElementById('cartGateBtn');
  var gateCountPill = document.getElementById('gateCountPill');
  var sync = document.getElementById('sync');
  var scanner = document.getElementById('scanner');

  var cartBadgeBtn = document.getElementById('cartBadgeBtn');
  var cartBadgeCount = document.getElementById('cartBadgeCount');

  var modeCameraBtn = document.getElementById('modeCameraBtn');
  var modeKeyboardBtn = document.getElementById('modeKeyboardBtn');
  var cameraPanel = document.getElementById('cameraPanel');
  var manualPanel = document.getElementById('manualPanel');
  var camFallback = document.getElementById('camFallback');
  var flashOk = document.getElementById('flashOk');

  var manualInput = document.getElementById('manualInput');
  var manualSendBtn = document.getElementById('manualSendBtn');

  var sheetBackdrop = document.getElementById('sheetBackdrop');
  var cartSheet = document.getElementById('cartSheet');
  var sheetCount = document.getElementById('sheetCount');
  var trashBtn = document.getElementById('trashBtn');
  var cartList = document.getElementById('cartList');

  var catalogStatus = document.getElementById('catalogStatus');
  var scanToast = document.getElementById('scanToast');
  var scanToastTimer = null;

  function vibrate(ms){
    try{ if (navigator.vibrate) navigator.vibrate(ms); }catch(e){}
  }

  // ---------- Catálogo: cargar de caché local y sincronizar con el servidor ----------
  function cargarCatalogo(){
    try{
      var cache = localStorage.getItem(LS_PRODUCTOS);
      if (cache){
        var parsed = JSON.parse(cache);
        productos = parsed.productos || [];
        setCatalogStatus('Catálogo guardado en el dispositivo · ' + formatFecha(parsed.actualizado) + ' · ' + productos.length + ' productos');
      } else {
        setCatalogStatus('Descargando catálogo…');
      }
    }catch(e){ /* caché no disponible o corrupta: se ignora */ }

    if (!API_URL || API_URL.indexOf('PEGA_AQUI') !== -1){
      if (!productos.length) setCatalogStatus('Catálogo no configurado (falta API_URL)');
      return;
    }

    fetch(API_URL, { cache: 'no-store' })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data && data.ok && Array.isArray(data.productos)){
          productos = data.productos;
          var actualizado = data.actualizado || new Date().toISOString();
          try{
            localStorage.setItem(LS_PRODUCTOS, JSON.stringify({ productos: productos, actualizado: actualizado }));
          }catch(e){ /* almacenamiento no disponible: sigue funcionando solo en memoria */ }
          setCatalogStatus('Catálogo actualizado · ' + formatFecha(actualizado) + ' · ' + productos.length + ' productos');
        }
      })
      .catch(function(){
        if (productos.length){
          setCatalogStatus('Sin conexión — usando catálogo guardado (' + productos.length + ' productos)');
        } else {
          setCatalogStatus('Sin conexión y sin catálogo guardado');
        }
      });
  }

  function formatFecha(iso){
    if (!iso) return '';
    try{
      var d = new Date(iso);
      return d.toLocaleString('es-BO', { dateStyle: 'short', timeStyle: 'short' });
    }catch(e){ return ''; }
  }

  function setCatalogStatus(text){
    catalogStatus.textContent = text;
  }

  window.addEventListener('online', function(){ cargarCatalogo(); });

  function findProduct(code){
    for (var i=0; i<productos.length; i++){
      if (String(productos[i].Pro_CodigoBarra || '').trim() === code) return productos[i];
    }
    return null;
  }

  // ---------- Alerta verde / roja + sonido + vibración ----------
  function beep(ok){
    try{
      if (!audioCtxScan) audioCtxScan = new (window.AudioContext || window.webkitAudioContext)();
      var ctx = audioCtxScan;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = ok ? 880 : 220;
      gain.gain.setValueAtTime(0.16, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.18);
    }catch(e){ /* audio no disponible: seguimos con el flash + vibración */ }
  }

  function showToast(ok, text){
    scanToast.className = 'scan-toast show ' + (ok ? 'ok' : 'error');
    scanToast.innerHTML =
      '<span class="icon">' + (ok ? '✓' : '✕') + '</span>' +
      '<span class="msg">' + escapeHtml(text) + '</span>';
    clearTimeout(scanToastTimer);
    scanToastTimer = setTimeout(function(){ scanToast.classList.remove('show'); }, 1700);
  }

  function feedback(ok, text){
    vibrate(ok ? 35 : [40,40,40]);
    beep(ok);
    showToast(ok, text);
    if (!cameraPanel.classList.contains('hidden')) playFlash(ok);
  }

  // ---------- Gate -> Sync -> Scanner ----------
  cartGateBtn.addEventListener('click', function(){
    vibrate(15);
    gate.classList.add('leaving');
    sync.classList.remove('hidden');
    requestAnimationFrame(function(){ sync.classList.add('active'); });

    setTimeout(function(){
      gate.classList.add('hidden');
      sync.classList.add('hidden');
      sync.classList.remove('active');
      scanner.classList.remove('hidden');
      requestAnimationFrame(function(){ scanner.classList.add('active'); });
      startCamera();
    }, 1100);
  });

  // ---------- Mode toggle ----------
  function setMode(mode){
    if (mode === 'camera'){
      modeCameraBtn.classList.add('selected');
      modeKeyboardBtn.classList.remove('selected');
      cameraPanel.classList.remove('hidden');
      manualPanel.classList.add('hidden');
      startCamera();
    } else {
      modeKeyboardBtn.classList.add('selected');
      modeCameraBtn.classList.remove('selected');
      manualPanel.classList.remove('hidden');
      cameraPanel.classList.add('hidden');
      stopCamera();
      setTimeout(function(){ manualInput.focus(); }, 50);
    }
  }
  modeCameraBtn.addEventListener('click', function(){ setMode('camera'); });
  modeKeyboardBtn.addEventListener('click', function(){ setMode('keyboard'); });

  // ---------- Camera ----------
  function startCamera(){
    if (html5QrCode || cameraStarting) return;
    if (typeof Html5Qrcode === 'undefined'){ showCamFallback(); return; }
    cameraStarting = true;
    camFallback.classList.add('hidden');

    var formats = null;
    try{
      formats = [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E
      ];
    }catch(e){ formats = null; }

    try{
      html5QrCode = new Html5Qrcode("reader", formats ? { formatsToSupport: formats, verbose:false } : { verbose:false });
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 230, height: 230 } },
        function onSuccess(decodedText){ handleScan(decodedText); },
        function onError(){ /* per-frame miss, ignore */ }
      ).then(function(){
        cameraStarting = false;
      }).catch(function(){
        cameraStarting = false;
        html5QrCode = null;
        showCamFallback();
      });
    }catch(e){
      cameraStarting = false;
      html5QrCode = null;
      showCamFallback();
    }
  }

  function stopCamera(){
    if (html5QrCode){
      var ref = html5QrCode;
      html5QrCode = null;
      ref.stop().then(function(){ try{ ref.clear(); }catch(e){} }).catch(function(){});
    }
  }

  function showCamFallback(){
    camFallback.classList.remove('hidden');
  }

  // ---------- Scan handling ----------
  function handleScan(rawCode){
    var code = (rawCode || '').trim();
    if (!code) return;
    var now = Date.now();
    if (lastScanAt[code] && (now - lastScanAt[code]) < SCAN_COOLDOWN_MS) return;
    lastScanAt[code] = now;

    addToCart(code);
  }

  function playFlash(ok){
    flashOk.classList.remove('play', 'fail');
    void flashOk.offsetWidth; // restart animation
    if (!ok) flashOk.classList.add('fail');
    flashOk.classList.add('play');
  }

  // ---------- Manual entry ----------
  manualInput.addEventListener('input', function(){
    manualSendBtn.disabled = manualInput.value.trim().length === 0;
  });
  manualInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') submitManual();
  });
  manualSendBtn.addEventListener('click', submitManual);

  function submitManual(){
    var val = manualInput.value.trim();
    if (!val) return;
    addToCart(val);
    manualInput.value = '';
    manualSendBtn.disabled = true;
    manualInput.focus();
  }

  // ---------- Cart ----------
  function addToCart(code){
    var p = findProduct(code);
    if (!p){
      feedback(false, 'Código ' + code + ' no encontrado');
      return;
    }
    var item = null;
    for (var i=0; i<cart.length; i++){ if (cart[i].id === p.Pro_Id){ item = cart[i]; break; } }
    if (item){ item.qty += 1; } else { cart.push({ id: p.Pro_Id, code: p.Pro_CodigoBarra, name: p.Pro_Descripcion, qty: 1 }); }
    renderCart();
    bumpBadge();
    feedback(true, p.Pro_Descripcion + ' añadido');
  }

  function removeFromCart(id){
    cart = cart.filter(function(it){ return it.id !== id; });
    renderCart();
  }

  function clearCart(){
    if (cart.length === 0) return;
    cart = [];
    renderCart();
    vibrate(20);
  }

  function totalQty(){
    return cart.reduce(function(sum, it){ return sum + it.qty; }, 0);
  }

  function renderCart(){
    var total = totalQty();

    // badges
    cartBadgeCount.textContent = String(total);
    cartBadgeCount.classList.toggle('show', total > 0);
    gateCountPill.textContent = String(total);
    gateCountPill.classList.toggle('show', total > 0);
    sheetCount.textContent = '(' + total + ')';

    // list
    if (cart.length === 0){
      cartList.innerHTML =
        '<div class="cart-empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="9" cy="21" r="1.4"/><circle cx="18" cy="21" r="1.4"/>' +
            '<path d="M2.5 3h2.4l2.1 11.4a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.6L21 7H6"/>' +
          '</svg>' +
          '<span>Tu carrito está vacío.<br>Escanea o digita un código para agregar productos.</span>' +
        '</div>';
      return;
    }

    var html = '';
    for (var i=0; i<cart.length; i++){
      var it = cart[i];
      html +=
        '<div class="cart-row" data-id="' + escapeHtml(it.id) + '">' +
          '<span class="dot"></span>' +
          '<span class="code">' + escapeHtml(it.name || it.code) + '</span>' +
          '<span class="qty">x' + it.qty + '</span>' +
          '<button class="remove-btn" aria-label="Quitar" data-remove="' + escapeHtml(it.id) + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>' +
          '</button>' +
        '</div>';
    }
    cartList.innerHTML = html;

    var removeBtns = cartList.querySelectorAll('[data-remove]');
    for (var j=0; j<removeBtns.length; j++){
      removeBtns[j].addEventListener('click', function(e){
        e.stopPropagation();
        removeFromCart(this.getAttribute('data-remove'));
      });
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function bumpBadge(){
    cartBadgeBtn.classList.remove('bump');
    void cartBadgeBtn.offsetWidth;
    cartBadgeBtn.classList.add('bump');
  }

  // ---------- Cart sheet ----------
  function openSheet(){
    sheetBackdrop.classList.add('open');
    cartSheet.classList.add('open');
  }
  function closeSheet(){
    sheetBackdrop.classList.remove('open');
    cartSheet.classList.remove('open');
  }
  cartBadgeBtn.addEventListener('click', openSheet);
  sheetBackdrop.addEventListener('click', closeSheet);
  trashBtn.addEventListener('click', clearCart);

  // ---------- Init ----------
  cargarCatalogo();
  renderCart();
})();
</script>
</body>
</html>
